[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-pin"
version = "0.1.0"
description = "Pin an MCP server's tool definitions and scan them for hidden instructions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yi-Ko Lin" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "anyio>=4.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mcp-pin = "mcppin:main"

[tool.setuptools]
py-modules = ["mcppin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
