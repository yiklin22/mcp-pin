name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q   # no test downloads models; all are fast

  action:
    # Runs this repo's action.yml against the fixture server.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          command: scan
          server: python tests/fixture_server.py
      - run: mcp-pin lock --file "$RUNNER_TEMP/lock.json" -- python tests/fixture_server.py
      - uses: ./
        with:
          server: python tests/fixture_server.py
          lock-file: ${{ runner.temp }}/lock.json
      - id: poisoned
        uses: ./
        continue-on-error: true
        env:
          POISON: "1"
        with:
          server: python tests/fixture_server.py
          lock-file: ${{ runner.temp }}/lock.json
          format: json
      - if: steps.poisoned.outcome != 'failure'
        run: |
          echo "check should have failed on the poisoned server"
          exit 1
      - name: the failure is exit 1 with a "changed" finding, not a crash
        env:
          POISON: "1"
        run: |
          set +e
          mcp-pin check --file "$RUNNER_TEMP/lock.json" --format json -- python tests/fixture_server.py > "$RUNNER_TEMP/out.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/out.json"
          test "$code" = 1
          grep -q '"rule": "changed"' "$RUNNER_TEMP/out.json"
